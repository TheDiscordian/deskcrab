<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c0a">
<title>Beatrice · OpenRSC</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090c0a; --card: #121813; --line: #29342b; --ink: #edf2e9;
    --dim: #9ba79c; --live: #70cf85; --warn: #e2b866; --bad: #dc776d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.35 system-ui, sans-serif; padding: max(10px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left)); }
  header { max-width: 1024px; margin: 0 auto 9px; display: flex; align-items: center;
    gap: 9px; min-height: 34px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em; flex: 1; }
  .dot { display: inline-block; width: 9px; height: 9px; margin-right: 7px;
    border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px #dc776d22; }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px #70cf8522; }
  button, a.button { appearance: none; border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--ink); padding: 6px 9px; font: inherit;
    text-decoration: none; cursor: pointer; }
  button:active, a.button:active { transform: translateY(1px); }
  main { max-width: 1024px; margin: auto; }
  .screen { position: relative; width: 100%; min-height: 180px; background: #000;
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    display: grid; place-items: center; }
  .screen img { display: block; width: 100%; height: auto; max-height: calc(100vh - 160px);
    object-fit: contain; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; }
  .game-pointer { display: none; position: absolute; z-index: 2; width: 25px; height: 25px;
    border: 3px solid #f0f; border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px #fff; pointer-events: none; }
  .game-pointer.visible { display: block; }
  .game-pointer::before, .game-pointer::after { content: ""; position: absolute;
    left: 50%; top: 50%; background: #f0f; transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 1px #fff); }
  .game-pointer::before { width: 45px; height: 2px; }
  .game-pointer::after { width: 2px; height: 45px; }
  .notice { position: absolute; inset: 0; display: grid; place-items: center;
    padding: 24px; text-align: center; color: var(--dim); background: #000c; }
  .notice.hidden { display: none; }
  .hud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    color: var(--dim); padding: 4px 9px; font-variant-numeric: tabular-nums; }
  .chip strong { color: var(--ink); font-weight: 600; }
  .chip.danger strong { color: var(--bad); }
  .read-only { color: var(--dim); font-size: 12px; margin: 8px 2px 0; }
  .read-only b { color: var(--live); font-weight: 600; }
  #screen:fullscreen { border: 0; border-radius: 0; width: 100vw; height: 100vh; }
  #screen:fullscreen img { width: 100vw; height: 100vh; max-height: none; object-fit: contain; }
  @media (orientation: landscape) and (max-height: 600px) {
    body { padding-top: 5px; padding-bottom: 5px; }
    header { margin-bottom: 5px; }
    .screen img { max-height: calc(100vh - 96px); }
    .read-only { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Beatrice · OpenRSC</h1>
  <button id="pause" type="button">Pause</button>
  <button id="fullscreen" type="button">Fullscreen</button>
  <a class="button" href="/" aria-label="Back to Beatrice">Back</a>
</header>
<main>
  <div class="screen" id="screen">
    <img id="frame" alt="Live read-only view of Beatrice playing OpenRSC">
    <div class="game-pointer" id="game-pointer" aria-hidden="true"></div>
    <div class="notice" id="notice">Connecting to her game…</div>
  </div>
  <div class="hud" id="hud"></div>
  <p class="read-only"><b>Read-only spectator.</b> This page has no route for mouse,
    keyboard, or game commands. Watching cannot interrupt her play.</p>
</main>
<script>
"use strict";
// The one-time share key has already become an HttpOnly, path-scoped cookie.
// Remove it from the visible/copyable URL without causing a second request.
if (new URLSearchParams(location.search).has("g"))
  history.replaceState(null, "", location.pathname);
const frame = document.getElementById("frame");
const notice = document.getElementById("notice");
const dot = document.getElementById("dot");
const hud = document.getElementById("hud");
const pause = document.getElementById("pause");
const screen = document.getElementById("screen");
const gamePointer = document.getElementById("game-pointer");
let running = true, generation = 0, frameAbort = null, objectUrl = "";
let pointerPosition = null;

const esc = value => String(value).replace(/[&<>"']/g, ch =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const chip = (label, value, cls="") =>
  `<span class="chip ${cls}">${esc(label)} <strong>${esc(value)}</strong></span>`;
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function updatePointer() {
  if (!pointerPosition || !frame.naturalWidth || !frame.naturalHeight) {
    gamePointer.classList.remove("visible");
    return;
  }
  const imageRect = frame.getBoundingClientRect();
  const screenRect = screen.getBoundingClientRect();
  const scale = Math.min(imageRect.width / frame.naturalWidth,
                         imageRect.height / frame.naturalHeight);
  const shownWidth = frame.naturalWidth * scale;
  const shownHeight = frame.naturalHeight * scale;
  const contentLeft = imageRect.left - screenRect.left - screen.clientLeft
    + (imageRect.width - shownWidth) / 2;
  const contentTop = imageRect.top - screenRect.top - screen.clientTop
    + (imageRect.height - shownHeight) / 2;
  const {x, y} = pointerPosition;
  if (x < 0 || y < 0 || x >= frame.naturalWidth || y >= frame.naturalHeight) {
    gamePointer.classList.remove("visible");
    return;
  }
  gamePointer.style.left = `${contentLeft + (x + .5) * scale}px`;
  gamePointer.style.top = `${contentTop + (y + .5) * scale}px`;
  gamePointer.classList.add("visible");
}

async function frameLoop() {
  if (!running || document.hidden || frameAbort) return;
  frameAbort = new AbortController();
  while (running && !document.hidden) {
    try {
      const res = await fetch(`/openrsc/frame.jpg?after=${generation}`, {
        cache: "no-store", credentials: "same-origin", signal: frameAbort.signal,
      });
      if (!res.ok) {
        let msg = "Her game is not available right now.";
        try { msg = (await res.json()).error || msg; } catch (_) {}
        notice.textContent = msg;
        notice.classList.remove("hidden");
        dot.classList.remove("live");
        await sleep(1000);
        continue;
      }
      const next = Number(res.headers.get("X-Frame-Generation") || generation + 1);
      const pointerX = Number(res.headers.get("X-Pointer-X"));
      const pointerY = Number(res.headers.get("X-Pointer-Y"));
      const nextPointer = Number.isFinite(pointerX) && Number.isFinite(pointerY)
        && pointerX >= 0 && pointerY >= 0 ? {x: pointerX, y: pointerY} : null;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const old = objectUrl;
      objectUrl = url;
      frame.onload = () => {
        if (frame.src === url) {
          pointerPosition = nextPointer;
          updatePointer();
        }
        if (old) URL.revokeObjectURL(old);
      };
      frame.src = url;
      generation = next;
      notice.classList.add("hidden");
      dot.classList.add("live");
    } catch (err) {
      if (err.name !== "AbortError") {
        notice.textContent = "Connection lost; retrying…";
        notice.classList.remove("hidden");
        dot.classList.remove("live");
        await sleep(1000);
      }
    }
  }
  frameAbort = null;
}

async function refreshState() {
  try {
    const res = await fetch("/openrsc/state", {
      cache: "no-store", credentials: "same-origin",
    });
    if (!res.ok) throw new Error("state unavailable");
    const st = await res.json();
    const bits = [];
    if (st.activity) bits.push(chip("Activity", st.activity));
    if (st.objective && st.objective !== st.activity)
      bits.push(chip("Objective", st.objective));
    if (st.hp) bits.push(chip("HP", `${st.hp.current}/${st.hp.maximum}`,
      st.hp.current * 3 <= st.hp.maximum ? "danger" : ""));
    if (st.fatigue !== null) bits.push(chip("Fatigue", st.fatigue));
    if (st.tile) bits.push(chip("Tile", `${st.tile.x}, ${st.tile.z}`));
    if (st.in_combat) bits.push(chip("State", "combat", "danger"));
    else if (st.sleeping) bits.push(chip("State", "sleeping"));
    else if (st.walking) bits.push(chip("State", "moving"));
    for (const xp of st.xp_rates || [])
      bits.push(chip(`${xp.skill} XP/hr`, Number(xp.per_hour).toLocaleString()));
    hud.innerHTML = bits.join("") || chip("Game", st.available ? "live" : "offline");
  } catch (_) {
    hud.innerHTML = chip("Game", "connection lost", "danger");
  }
}

pause.addEventListener("click", () => {
  running = !running;
  pause.textContent = running ? "Pause" : "Resume";
  if (!running) {
    if (frameAbort) frameAbort.abort();
    notice.textContent = "Spectator paused";
    notice.classList.remove("hidden");
  } else {
    frameLoop();
  }
});
document.getElementById("fullscreen").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else screen.requestFullscreen().catch(() => {});
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (frameAbort) frameAbort.abort();
  } else if (running) frameLoop();
});
window.addEventListener("resize", updatePointer);
document.addEventListener("fullscreenchange", updatePointer);
setInterval(() => { if (!document.hidden) refreshState(); }, 1000);
refreshState();
frameLoop();
</script>
</body>
</html>
