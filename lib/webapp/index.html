<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beatrice">
<title>DeskCrab</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#000; --fg:#e0e0e0; --dim:#888; --accent:#6aafff;
          --panel:#141414; --code:#2a2a2a; --border:#333; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; line-height: 1.6;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { color: var(--dim); font-size: 13px; flex: 1; text-align: right; }
  #status.busy { color: var(--accent); }
  #status.err { color: #ff8080; }
  #bell { background: none; border: none; font: inherit; font-size: 16px;
          padding: 0 2px; cursor: pointer; filter: grayscale(1); opacity: .55; }
  #bell.on { filter: none; opacity: 1; }
  /* The public-pocket switch. Unmuted it sits as quietly as the bell; muted it
     wears the page's danger colours, because a glance must settle whether this
     phone can make a sound. */
  #mute { background: none; border: none; font: inherit; font-size: 16px;
          padding: 0 2px; cursor: pointer; filter: grayscale(1); opacity: .55; }
  #mute.muted { filter: none; opacity: 1; background: #3a1414;
                border: 1px solid #a33; border-radius: 8px; padding: 2px 8px; }

  main { flex: 1; overflow-y: auto; padding: 16px; }
  .turn { margin-bottom: 18px; }
  /* Where the conversation already was when this page loaded — dimmed, so it
     never reads as something said just now. */
  #seed { margin-bottom: 22px; padding-bottom: 14px;
          border-bottom: 1px dashed var(--border); }
  #seed .turn { opacity: .72; }
  .seed-label { color: var(--dim); font-size: 12px; text-transform: uppercase;
                letter-spacing: .08em; margin-bottom: 10px; }
  .seed-summary { color: var(--dim); font-size: 13px; line-height: 1.5;
                  white-space: pre-wrap; margin-bottom: 16px;
                  padding-left: 10px; border-left: 2px solid var(--border); }
  /* The conversation file was rewritten under this page — compacted, or rotated
     to the archive so a fresh one starts. Everything above the rule was said
     before that happened, and it stays on screen. */
  .rewound { display: flex; align-items: center; gap: 10px;
             color: var(--dim); font-size: 11px; text-transform: uppercase;
             letter-spacing: .08em; margin: 4px 0 20px; }
  .rewound::before, .rewound::after { content: ""; flex: 1;
             border-top: 1px dashed var(--border); }
  /* Said at the laptop, not here — marked so it never reads as this phone's
     own turn arriving. */
  .turn.elsewhere { border-left: 2px solid var(--border); padding-left: 10px; }
  .turn.elsewhere::before { content: "at the laptop"; display: block;
                            color: var(--dim); font-size: 11px;
                            text-transform: uppercase; letter-spacing: .08em;
                            margin-bottom: 6px; }
  .you { color: var(--dim); }
  .you::before { content: "› "; }
  .reply { white-space: pre-wrap; }
  .thoughts { margin: 6px 0 8px; padding-left: 10px; border-left: 2px solid var(--border); }
  .thought { color: var(--dim); font-size: 12px; line-height: 1.45;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thought.tool { color: var(--accent); opacity: .8; }
  /* The whole trail is kept, not just the tail — scrolling back through the
     log should show what was thought and run on every past turn. Folded once
     the turn ends so old turns stay one line. */
  .thoughts.folded .thought { display: none; }
  .th-head { color: var(--dim); font-size: 12px; cursor: pointer;
             margin: 6px 0 2px; user-select: none; }
  /* Display blocks live inside the turn that produced them, so scrolling back
     through the log shows each one where it belongs. Tap the header to fold. */
  .display { margin-top: 12px; background: var(--panel);
             border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .disp-head { padding: 8px 12px; font-size: 13px; color: var(--dim);
               display: flex; align-items: center; gap: 8px; cursor: pointer;
               user-select: none; background: var(--code); }
  .disp-head .caret { transition: transform .15s; }
  .display.folded .disp-head .caret { transform: rotate(-90deg); }
  .disp-body { padding: 12px; }
  .display.folded .disp-body { display: none; }
  .disp-body img { max-width: 100%; height: auto; border-radius: 6px; }
  .disp-body pre { background: var(--code); padding: 12px; border-radius: 6px; overflow-x: auto; }
  .disp-body code { background: var(--code); padding: 2px 6px; border-radius: 3px; }
  .disp-body pre code { background: none; padding: 0; }
  .disp-body table { border-collapse: collapse; width: 100%; }
  .disp-body th, .disp-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .disp-body a { color: var(--accent); }
  .disp-body > :first-child { margin-top: 0; }
  .disp-body > :last-child { margin-bottom: 0; }

  /* The transport for a handed piece (crab play): its name, the native
     controls for play/pause and seek, and its own dismissal. display:flex
     would defeat the hidden attribute, so hidden is restated. */
  #media { border-top: 1px solid var(--border); background: var(--panel);
           padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  #media[hidden] { display: none; }
  #media-head { display: flex; align-items: center; gap: 8px; }
  #media-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-size: 13px; }
  #media-title::before { content: "♪ "; color: var(--accent); }
  #media-close { background: none; border: none; color: var(--dim); font: inherit;
                 cursor: pointer; padding: 0 4px; }
  #media audio { width: 100%; height: 36px; }

  footer { padding: 16px; border-top: 1px solid var(--border); display: flex;
           flex-direction: column; gap: 12px; }
  #talk {
    width: 100%; padding: 26px; font: inherit; font-size: 17px; font-weight: 600;
    color: var(--fg); background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; touch-action: none; user-select: none;
  }
  #playnow { padding: 14px; font: inherit; font-size: 16px; color: #ffdada;
             background: #143a1a; border: 1px solid #3a3; border-radius: 12px; }
  #talk.rec { background: #3a1414; border-color: #a33; color: #ffdada; }
  #talk.busy { opacity: .45; }
  /* Speech is playing: the same button is now also the stop control. Wins over
     .busy because a turn's clips play while the turn is still running — which
     is exactly when stopping matters most. */
  #talk.speaking { opacity: 1; border-color: #a33; color: #ffdada; }
  .row { display: flex; gap: 8px; }
  #text { flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--fg);
          background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #send { padding: 12px 16px; font: inherit; color: var(--fg); background: var(--panel);
          border: 1px solid var(--border); border-radius: 10px; }
</style>
</head>
<body>
<header><h1 id="name">DeskCrab</h1><span id="status">ready</span><button id="mute">🔊</button><button id="bell" hidden>🔔</button></header>
<main>
  <div id="log"></div>
</main>
<div id="media" hidden>
  <div id="media-head">
    <span id="media-title"></span>
    <button id="media-close">✕</button>
  </div>
  <audio id="music" controls playsinline></audio>
</div>
<footer>
  <button id="talk">Hold to talk</button>
  <div class="row">
    <input id="text" placeholder="…or type" autocomplete="off" enterkeyhint="send">
    <button id="send">Send</button>
  </div>
</footer>
<audio id="player" playsinline></audio>
<script>
const $ = id => document.getElementById(id);
const statusEl = $("status"), logEl = $("log"), player = $("player");
const music = $("music");
let recorder = null, chunks = [], stream = null, busy = false;
let sttSid = null, sttChain = Promise.resolve(), sttFailed = false;

function randomHex(n) {
  const b = new Uint8Array(n / 2);
  crypto.getRandomValues(b);
  return [...b].map(x => x.toString(16).padStart(2, "0")).join("");
}

function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

function addTurn(you) {
  const t = document.createElement("div");
  t.className = "turn";
  const y = document.createElement("div"); y.className = "you"; y.textContent = you;
  const r = document.createElement("div"); r.className = "reply"; r.textContent = "…";
  t.append(y, r); logEl.append(t);
  t.scrollIntoView({ block: "end" });
  return { you: y, reply: r };
}

// Autoplay is only reliably granted inside a user gesture, and the reply lands
// seconds after the button is released — so the element is unlocked during the
// gesture and merely re-pointed at the reply later. It must actually PLAY
// something to count: play() on a src-less element rejects immediately and
// earns no activation at all, which is why the reply used to arrive silent.
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";
let unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  player.src = SILENCE;
  const p = player.play();
  if (p) p.then(() => { unlocked = true; }).catch(() => {});
}

// If the browser still refuses, don't silently swallow it — give him a button.
function offerPlay(src) {
  setStatus("tap ▶ to hear it", "err");
  let b = $("playnow");
  if (!b) {
    b = document.createElement("button");
    b.id = "playnow"; b.textContent = "▶ Play reply";
    b.addEventListener("click", () => {
      const p = player.play();
      if (p) p.then(() => { voicePlaying = true; updateTalkBtn(); }).catch(() => {});
      setStatus("ready");
    });
    $("talk").parentNode.insertBefore(b, $("talk"));
  }
  b.hidden = false;
  player.addEventListener("play", () => { b.hidden = true; }, { once: true });
}

// One collapsible card per turn, appended after that turn's reply.
function attachDisplay(replyEl, html) {
  const box = document.createElement("div");
  box.className = "display";
  const head = document.createElement("div");
  head.className = "disp-head";
  head.innerHTML = '<span class="caret">\u25be</span><span>details</span>';
  const body = document.createElement("div");
  body.className = "disp-body";
  body.innerHTML = html;
  head.addEventListener("click", () => box.classList.toggle("folded"));
  box.append(head, body);
  replyEl.parentNode.append(box);
}

// Clips arrive while the turn is still running (one per text block, exactly as
// the desktop speaks them), so they queue and play back to back — never on top
// of each other.
const voiceQueue = [];
let voicePlaying = false;

// The phone's SUPER+SHIFT+A, folded into the talk button itself: while speech
// is playing (or queued) a short TAP on it stops the voice; press-and-hold
// still records. Nothing floats over the conversation any more.
// Stopping is not pausing: the queue is emptied, the current clip unloaded
// (which aborts its download), and clips still streaming in for this turn are
// dropped on arrival — otherwise the voice would fall silent only until the
// next chunk landed and then carry on. A new turn, or a new wake, speaks again.
let voiceMuted = false;
const talk = $("talk");

// One button, three looks. Recording owns the label outright; otherwise it
// advertises tap-to-stop whenever anything is playing or queued — including
// mid-turn, which is exactly when the voice is talking.
function updateTalkBtn() {
  if (talk.classList.contains("rec")) return;
  const speaking = voicePlaying || voiceQueue.length > 0;
  talk.classList.toggle("speaking", speaking);
  talk.textContent = speaking ? "◼ Tap to stop · hold to talk" : "Hold to talk";
}

function stopSpeech() {
  voiceMuted = true;
  voiceQueue.length = 0;
  voicePlaying = false;
  player.pause();
  player.removeAttribute("src");
  player.load();
  updateTalkBtn();
  setStatus("speech stopped");
}

function enqueueVoice(url) {
  if (voiceMuted) return;
  voiceQueue.push(url);
  playNextVoice();
  updateTalkBtn();
}

function playNextVoice() {
  if (voicePlaying || !voiceQueue.length) return;
  const url = voiceQueue.shift();
  voicePlaying = true;
  player.src = url;
  player.load();
  const p = player.play();
  if (p) p.catch(() => { voicePlaying = false; updateTalkBtn(); offerPlay(url); });
  updateTalkBtn();
}

player.addEventListener("ended", () => { voicePlaying = false; playNextVoice(); updateTalkBtn(); });
player.addEventListener("error", () => { voicePlaying = false; playNextVoice(); updateTalkBtn(); });

// The mute, for a phone that fires in a public pocket. Persistent across
// reloads, and it silences EVERYTHING the page can sound — the voice clips
// through #player and a handed piece through #music. Silences, never
// suppresses: clips still queue, cursors still advance, the transport still
// appears, so unmuting never replays a backlog and never loses one either.
// Element muted-ness survives src changes, so setting it once per toggle
// covers every clip that follows.
let muted = false;

function applyMute(m) {
  muted = !!m;
  player.muted = muted;
  music.muted = muted;
  const b = $("mute");
  b.textContent = muted ? "🔇" : "🔊";
  b.classList.toggle("muted", muted);
  b.title = muted ? "Muted — tap for sound" : "Sound on — tap to mute";
  try { localStorage.setItem("crab-muted", muted ? "1" : "0"); } catch (_) {}
}

function initMute() {
  let m = false;
  try { m = localStorage.getItem("crab-muted") === "1"; } catch (_) {}
  applyMute(m);
}

function toggleMute() {
  applyMute(!muted);
  setStatus(muted ? "muted — nothing will sound" : "sound on");
}
$("mute").addEventListener("click", toggleMute);
initMute();

// A handed piece (crab play) rides /watch beside the wake audio, with its own
// cursor. It is music with a length, not a reply — so it plays through its own
// element with a visible transport (name, play/pause, seek) rather than
// through the voice queue, and stopping speech never stops it.
let playSeen = "";

function showMedia(play) {
  $("media-title").textContent = play.title || "";
  music.muted = muted;
  music.src = play.url;
  $("media").hidden = false;
  const p = music.play();
  // Autoplay refused (no gesture yet): the transport's own ▶ is right there.
  if (p) p.catch(() => {});
}

function closeMedia() {
  music.pause();
  music.removeAttribute("src");
  music.load();
  $("media").hidden = true;
}
$("media-close").addEventListener("click", closeMedia);

async function deliver(res, replyEl) {
  if (res.error) {
    setStatus(res.error, "err");
    // Never overwrite what she already said. A reply that streamed in full and
    // then lost its connection used to have every word replaced by the error
    // text — the reply was on the screen and the failure erased it. The error
    // is a note under the answer when there is one, and the whole bubble only
    // when there is not.
    if (replyEl.textContent) {
      const note = document.createElement("div");
      note.className = "thought";
      note.textContent = "(" + res.error + ")";
      replyEl.parentNode.append(note);
    } else {
      replyEl.textContent = "(" + res.error + ")";
    }
    return;
  }
  // `spoken` is every text block of the turn joined — the SAME blocks already
  // streamed in as `text` events. Appending it wholesale printed the entire
  // reply a second time. Only the part that never streamed is added, which
  // covers the non-streaming path where nothing arrived live at all.
  addSaid(replyEl, residue(replyEl, res.spoken));
  if (res.display_html) attachDisplay(replyEl, res.display_html);
  // Silence is silence. A turn that produced no spoken text and nothing to
  // show leaves NO bubble behind — printing a placeholder announced the
  // emptiness, which reads as the assistant saying "no reply" out loud.
  if (!replyEl.textContent && !replyEl.querySelector("*")) replyEl.remove();
  setStatus("ready");
  if (res.audio) enqueueVoice(res.audio);
  replyEl.scrollIntoView({ block: "end" });
}

// The turn arrives as a stream of events, not one reply: thinking and tool use
// are shown as they happen, exactly like the desktop client, so a long answer
// isn't a silent spinner. The last event carries the finished reply.
//
// The uplink is a phone hotspot, so this stream routinely dies mid-turn. The
// turn keeps running on the laptop and every event is buffered there under a
// client-chosen id — on any error we reconnect with backoff (1s, 2s, 4s …
// capped at 30s) to /turn/<id>?from=<n> and pick up exactly where we left off.
// A dropped network is a "reconnecting…" status, never a dead error page.
// The server writes a `: ping` comment frame every ~15 s whenever the turn has
// produced nothing, so bytes arriving is the liveness signal — and their
// absence for this long means a socket that is open only in this end's
// imagination (hotspot gone, laptop asleep), which TCP alone will sit on for
// many minutes. Same shape as the 45 s guard on the /watch poll.
const STREAM_IDLE_MS = 45000;

async function streamTurn(text, turn, tid, resuming, seq) {
  tid = tid || randomHex(32);
  let seen = 0, delay = 1000;
  // A re-attach after a reload replays the whole buffered backlog in a burst,
  // voice events included — clips that were already playing when the page
  // died. Re-sounding them reads as the reply starting over, so replayed
  // clips are dropped and only clips arriving live after the re-attach play
  // (spec rule 39). The boundary is a moment of wall clock because the
  // stream itself does not mark it; the backlog lands in milliseconds.
  let voiceGateUntil = resuming ? Date.now() + 1500 : 0;
  // Progress, not wall clock: every event pushes the deadline forward, so a
  // long turn that is visibly working is never cut off, while a turn that has
  // gone silent on a link healthy enough to carry keepalives forever still
  // ends here. Pings reset the idle timer below (the link is alive) but never
  // this (the turn is not). Six minutes, down from fifteen: nothing
  // legitimate on the remote profile is silent that long, the reply still
  // arrives through /watch if the turn completes later, and a button held
  // grey for tens of minutes was answered with a hand reload every time.
  const GIVE_UP_MS = 6 * 60 * 1000;
  let deadline = Date.now() + GIVE_UP_MS;
  const giveUp = { error: "gave up: no progress in 6 minutes" };
  for (;;) {
    // Ended from outside by the conversation watcher (rule 42): this loop's
    // turn is over. Reconnecting would re-tail a buffer nobody is waiting on
    // — and overwrite a newer turn's abort handle below.
    if (releasedSeq === seq) return null;
    // Checked HERE as well as in the catch. It used to be consulted only
    // after a throw, so a fetch that never threw and never delivered another
    // byte held `busy` forever: recording refused, the reset redraw refused,
    // and nothing short of a manual reload got the page back. There were 74
    // hand reloads in 28 hours.
    if (Date.now() > deadline)
      return giveUp;
    const ctl = new AbortController();
    turnCtl = ctl;
    let idle = setTimeout(() => ctl.abort(), STREAM_IDLE_MS);
    const alive = () => {
      clearTimeout(idle);
      idle = setTimeout(() => ctl.abort(), STREAM_IDLE_MS);
    };
    try {
      // While nothing has arrived we cannot know whether the POST ever landed,
      // so retry the POST itself — the server treats a repeated id as "attach",
      // never as a second run. Once events have arrived the turn provably
      // exists, so reconnects go to /turn and only fetch what was missed.
      const r = seen === 0
        ? await fetch("/say", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, turn: tid }),
            signal: ctl.signal,
          })
        : await fetch("/turn/" + tid + "?from=" + seen,
                      { credentials: "same-origin", signal: ctl.signal });
      if (r.status === 404 && seen > 0)
        return { error: "the server restarted mid-turn; the reply was lost" };
      if (!r.ok) throw new Error("HTTP " + r.status);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done: eof } = await reader.read();
        if (eof) break;
        alive();
        buf += dec.decode(value, { stream: true });
        let cut;
        while ((cut = buf.indexOf("\n\n")) !== -1) {
          const frame = buf.slice(0, cut); buf = buf.slice(cut + 2);
          if (!frame.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(frame.slice(5).trim()); } catch (e) { continue; }
          seen++; delay = 1000;
          lastTurnProgress = Date.now();
          deadline = lastTurnProgress + GIVE_UP_MS;
          if (ev.kind === "done") return ev;
          if (ev.kind === "voice") {
            if (Date.now() >= voiceGateUntil) { turnVoiced = true; enqueueVoice(ev.audio); }
            continue;
          }
          showThought(turn, ev);
        }
        // Pings land here as bytes that parse to nothing. A turn whose done
        // event will never come, on a healthy link, therefore never throws,
        // never EOFs, and never returns — the surviving half of C10: the
        // permanent "thinking…", ended by a hand reload. So the deadline is
        // consulted on every read as well, which also holds where a
        // backgrounded tab throttles every timer.
        if (Date.now() > deadline) return giveUp;
      }
      // Stream ended without a done event: the connection was cut, not the
      // turn. Fall through to reconnect.
      throw new Error("stream cut");
    } catch (e) {
      if (releasedSeq === seq) return null;
      // An abort lands here like any other cut: the turn is still running on
      // the laptop, buffered under its id, and the reconnect below picks it
      // up from exactly where this socket stopped.
      setStatus("reconnecting…", "busy");
      if (turnKicked) {
        // The page just came back to the foreground and cut a stale attempt
        // itself (spec rule 41). Backoff exists for a link that keeps
        // failing, not for a socket the OS froze — reconnect now.
        turnKicked = false;
        delay = 1000;
        await new Promise(res => setTimeout(res, 250));
      } else {
        await new Promise(res => setTimeout(res, delay));
        delay = Math.min(delay * 2, 30000);
      }
    } finally {
      clearTimeout(idle);
      if (turnCtl === ctl) turnCtl = null;
    }
  }
}

function headText(box) {
  const n = box.children.length;
  return (box.classList.contains("folded") ? "▸ " : "▾ ") + n +
         (n === 1 ? " step" : " steps");
}

function foldThoughts(turn) {
  if (!turn.thoughts) return;
  turn.thoughts.classList.add("folded");
  turn.thHead.textContent = headText(turn.thoughts);
}

// The reply accumulates on the element itself, so the final `done` event can
// tell whether crab's spoken text is a block already shown or a new one.
function norm(s) { return (s || "").replace(/\s+/g, " ").trim(); }

// What of `text` has NOT already been shown. crab's final `spoken` is the whole
// turn's blocks joined, so after streaming it is normally entirely redundant;
// when nothing streamed it is entirely new. Both are the same subtraction.
function residue(replyEl, text) {
  const said = replyEl._said || [];
  if (!said.length) return text;
  let rest = norm(text);
  for (const block of said) {
    const b = norm(block);
    if (b && rest.startsWith(b)) rest = rest.slice(b.length).trim();
  }
  return rest;
}

function addSaid(replyEl, text) {
  const said = replyEl._said || (replyEl._said = []);
  if (!norm(text)) return;
  if (norm(said[said.length - 1]) === norm(text)) return;
  said.push(text);
  // The stored Assistant: line is exactly these blocks joined, and it lands
  // in the convo file seconds BEFORE the done event — conversation compaction
  // and voice synthesis both run between the append and the JSON that becomes
  // done. The own-turn filter must therefore be kept current block by block:
  // waiting for done meant the watcher echoed every reply back as a turn
  // "at the laptop" during that gap.
  pendingReply = norm(said.join(" "));
  replyEl.textContent = said.join("\n\n");
  replyEl.scrollIntoView({ block: "end" });
}

function showThought(turn, ev) {
  if (ev.kind === "transcript") return;
  // Every text block is part of the answer, not a status line — append it in
  // order so the transcript grows as the turn runs, exactly as it's spoken.
  if (ev.kind === "text") { addSaid(turn.reply, ev.text); return; }
  let box = turn.thoughts;
  if (!box) {
    const head = document.createElement("div");
    head.className = "th-head";
    box = document.createElement("div");
    box.className = "thoughts";
    head.onclick = () => {
      box.classList.toggle("folded");
      head.textContent = headText(box);
    };
    turn.reply.parentNode.insertBefore(head, turn.reply);
    turn.reply.parentNode.insertBefore(box, turn.reply);
    turn.thoughts = box; turn.thHead = head;
  }
  if (ev.kind === "wait") {
    // Rule 43: one line, updated in place. These arrive every half-minute for
    // as long as the turn is queued behind the lock, and a growing pile of
    // near-identical rows would read as thinking happening when none is.
    let wline = turn.waitLine;
    if (!wline) {
      wline = document.createElement("div");
      wline.className = "thought wait";
      box.append(wline);
      turn.waitLine = wline;
      turn.thHead.textContent = headText(box);
      wline.scrollIntoView({ block: "end" });
    }
    wline.textContent = "⏳ " + ev.text;
    setStatus(ev.text, "busy");
    return;
  }
  const line = document.createElement("div");
  line.className = "thought " + ev.kind;
  line.textContent = (ev.kind === "tool" ? "⚙ " : "… ") + ev.text;
  box.append(line);
  turn.thHead.textContent = headText(box);
  setStatus(ev.kind === "tool" ? "working…" : "thinking…", "busy");
  // Tool lines don't steal the viewport: a thought followed by a tool call
  // would otherwise yank the screen past the thought before it can be read.
  if (ev.kind !== "tool") line.scrollIntoView({ block: "end" });
}

// Every request the turn path makes is bounded (spec rule 40): a fetch that
// hangs on a half-dead link never rejects on its own, and an unbounded await
// anywhere in runTurn holds `busy` — a grey button — until the watchdog,
// which from a phone is indistinguishable from forever.
function post(url, body, headers, timeoutMs) {
  const ctl = new AbortController();
  const guard = setTimeout(() => ctl.abort(), timeoutMs || 30000);
  return fetch(url, { method: "POST", body, headers,
                      credentials: "same-origin", signal: ctl.signal })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .finally(() => clearTimeout(guard));
}

// A turn is two requests, not one: transcription comes back in a second or two
// and is shown immediately, so a mis-heard sentence is visible during the long
// wait for the answer rather than after it.
async function runTurn(blob, ctype, typed, resumeTid, resumeAt) {
  if (busy) return;
  // Dimmed, not disabled: a disabled button gets no pointer events, and the
  // reply's clips play while the turn is still running — tap-to-stop must
  // keep working exactly then. startRec's own busy guard blocks recording.
  busy = true; talk.classList.add("busy");
  lastTurnProgress = Date.now();
  const seq = ++turnSeq;
  const disarmWatchdog = armTurnWatchdog(seq);
  // Asking again means wanting the answer aloud again.
  voiceMuted = false;
  turnVoiced = false;
  const turn = addTurn(typed || "🎤 …");
  // Held where the watcher can reach it: the reply can arrive through the
  // conversation instead of this turn's stream (rule 42), and it must land in
  // this bubble, not beside it.
  liveTurn = turn;
  try {
    let text = typed;
    if (!text) {
      setStatus("transcribing…", "busy");
      // Nearly all of this audio is already on the laptop and decoded, so
      // finishing usually only leaves the last slice to transcribe. If any
      // slice failed to upload the session is incomplete and we fall back to
      // sending the whole recording the old way. Every wait here is bounded
      // (spec rule 40): a slice upload stuck on a half-dead link used to
      // hold this await — and the button — until the watchdog.
      let t;
      const sid = sttSid;
      const settled = await Promise.race([
        sttChain.then(() => true, () => false),
        new Promise(res => setTimeout(() => res(false), 8000)),
      ]);
      if (!settled) sttFailed = true;
      if (sid && !sttFailed) {
        t = await post("/stt/finish?s=" + sid, null, { "X-Audio-Type": ctype }, 30000)
              .catch(() => ({ error: "stream lost" }));
        if (t.error) t = null;
      }
      if (!t) t = await post("/transcribe", blob, { "X-Audio-Type": ctype }, 75000);
      if (t.error) { turn.reply.textContent = "(" + t.error + ")"; setStatus(t.error, "err"); return; }
      text = t.transcript;
      turn.you.textContent = text;
      turn.you.scrollIntoView({ block: "end" });
    }
    setStatus(resumeTid ? "picking the turn back up…" : "thinking…", "busy");
    // This turn is about to land in the convo file too; the watcher filters
    // it by text rather than skipping everything in the window, so a wake or
    // laptop turn landing mid-flight still renders instead of vanishing.
    pendingUser = norm(text);
    pendingReply = null;
    awaitedUserSeen = false;
    // Transcription may have taken a while; the watchdog measures the stream
    // from here, not from the press of the button.
    lastTurnProgress = Date.now();
    // Remembered so a reload mid-turn re-attaches instead of orphaning the
    // turn behind the lock (spec rule 39); forgotten the moment it ends. A
    // resume carries the ORIGINAL clock forward: restamping it here made the
    // ten-minute bound measure from the latest reload, so a reload storm
    // could pick a dead turn back up forever.
    const tid = resumeTid || randomHex(32);
    rememberTurn(tid, text, resumeAt);
    const res = await streamTurn(text, turn, tid, !!resumeTid, seq);
    // Null means the watcher ended this turn first (rule 42): the bubble,
    // the button, and the status were all settled there.
    if (res && releasedSeq !== seq) {
      foldThoughts(turn);
      if (res.spoken) pendingReply = norm(res.spoken);
      await deliver(res, turn.reply);
    } else if (res && res.audio) {
      // The voice tail of a released turn (rule 42): the words were already
      // reconciled to the record, but nothing had been voiced, so the
      // completion clip is the only sound this turn will ever make. Play it;
      // touch nothing else.
      enqueueVoice(res.audio);
    }
  } catch (e) {
    setStatus(String(e.message || e), "err");
    turn.reply.textContent = "(failed)";
  } finally {
    disarmWatchdog();
    // If the watchdog fired, the page is already idle and a NEW turn may be
    // running — that turn's state is not this one's to clear.
    if (turnSeq === seq) {
      forgetTurn();
      liveTurn = null;
      busy = false; talk.classList.remove("busy");
      updateTalkBtn();
    }
  }
}

// The memory that survives a reload: which turn was in flight, what was asked,
// and when. Rule 1 makes re-posting the same identifier an attach, so a page
// that comes back re-joins its own turn rather than leaving it running
// invisibly — holding the lock — while the re-asked question queues behind it.
function rememberTurn(tid, text, at) {
  try {
    localStorage.setItem("crab-turn",
                         JSON.stringify({ tid, text, at: at || Date.now() }));
  } catch (_) {}
}

function forgetTurn() {
  try { localStorage.removeItem("crab-turn"); } catch (_) {}
}

// Ten minutes: past the give-up, past the watchdog, and past any run a phone
// turn is allowed — a memory older than this is a page nobody reloaded, and
// re-posting it could START a turn (the buffer TTL-swept, rule 1 creates).
const RESUME_MAX_AGE_MS = 10 * 60 * 1000;

function resumePending(ctx) {
  let rec = null;
  try { rec = JSON.parse(localStorage.getItem("crab-turn") || "null"); } catch (_) {}
  if (!rec || !rec.tid || !rec.text) return;
  if (Date.now() - (rec.at || 0) > RESUME_MAX_AGE_MS) { forgetTurn(); return; }
  // Already answered and already on screen: the seed carries the exchange, so
  // there is nothing to re-attach to — re-drawing it would double the bubble.
  const turns = (ctx && ctx.turns) || [];
  for (let i = turns.length - 1; i >= 0; i--)
    if (turns[i].role === "user" && norm(turns[i].text) === norm(rec.text)) {
      forgetTurn();
      return;
    }
  runTurn(null, null, rec.text, rec.tid, rec.at);
}

// The last line of defence against C10: if `busy` is still set long after
// anything last happened — the stream given up on and some later await never
// settling, or a path nobody has imagined yet — the page is returned to idle
// by force. It should never fire while streamTurn's own deadline works; it
// exists so no single missed path can cost a hand reload again. Deliberately
// longer than the stream's give-up, so the polite path always gets to answer
// first.
let lastTurnProgress = 0;
let turnCtl = null;
let turnSeq = 0;
// The turn the conversation watcher ended (rule 42). streamTurn compares its
// own sequence against this and returns quietly instead of reconnecting to a
// turn the page no longer owns.
let releasedSeq = 0;
// Whether this turn has sounded a single clip yet. A watcher release with this
// still false must leave the stream open: the sound is still on its way down
// it, and cutting the socket was how a reply arrived in writing and in silence.
let turnVoiced = false;
// The in-flight turn's bubbles, so a watcher-delivered reply lands in them
// rather than beside them.
let liveTurn = null;
// Set by the foreground kick just before it aborts a stale attempt, read by
// streamTurn's catch: this cut asks for an immediate reconnect, not backoff.
let turnKicked = false;

function armTurnWatchdog(seq) {
  // Seven minutes, one past the stream's own give-up so the polite path
  // always answers first — and polled every five seconds, because a watchdog
  // that fires up to half a minute late is half a minute of a dead grey
  // button. Seventeen minutes was not a defence anyone lived to see.
  const limit = 7 * 60 * 1000, poll = 5 * 1000;
  const timer = setInterval(() => {
    if (!busy || turnSeq !== seq) { clearInterval(timer); return; }
    if (Date.now() - lastTurnProgress < limit) return;
    clearInterval(timer);
    if (turnCtl) turnCtl.abort();
    busy = false;
    talk.classList.remove("busy");
    updateTalkBtn();
    setStatus("the turn stalled — ready again", "err");
  }, poll);
  return () => clearInterval(timer);
}

// The foreground kick (spec rule 41). While the page is hidden the OS freezes
// its timers and lets its sockets rot, so a turn that was streaming when the
// screen locked comes back to a fetch that will never deliver and an idle
// timer that has not been allowed to fire. Coming back to the foreground is
// the moment to notice: cut the stale attempt so the reconnect happens NOW,
// and if the whole turn is past saving, let the watchdog's own check run
// rather than waiting out a throttled interval.
function kickStaleTurn() {
  if (!busy) return;
  if (Date.now() - lastTurnProgress < STREAM_IDLE_MS) return;
  if (turnCtl) { turnKicked = true; turnCtl.abort(); }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) kickStaleTurn();
});

// Set on press (past the hold threshold), cleared on release. getUserMedia can
// resolve after a very quick release — without this check the recorder would
// start with nothing left to stop it.
let recWanted = false;

async function startRec() {
  if (busy) return;
  recWanted = true;
  // The cached stream can die while the page is away — the browser revokes
  // the microphone on a locked screen — and a dead stream records nothing:
  // every hold after that came back "too short" until a reload (spec rule
  // 41). A track that has ended is not a microphone; take a fresh one.
  if (stream && stream.getTracks().some(t => t.readyState === "ended")) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { setStatus("no microphone: " + e.name, "err"); return; }
  if (!recWanted) return;
  // No mimeType is specified on purpose: Chrome gives webm/opus, iOS Safari
  // gives mp4/aac, and ffmpeg decodes either. Hardcoding one breaks the other.
  chunks = [];
  // Held in a local as well: stopRec() clears the global immediately, and
  // onstop fires afterwards — reading the global there would be reading null.
  const rec = new MediaRecorder(stream);
  recorder = rec;
  // Audio goes up while you are still talking, not after you let go: by the
  // time the button is released the laptop has already decoded and largely
  // transcribed everything but the tail. Slices are chained rather than fired
  // in parallel because after the first they carry no container header and
  // only mean anything appended in order.
  sttSid = randomHex(24);
  sttChain = Promise.resolve();
  sttFailed = false;
  rec.ondataavailable = e => {
    if (!e.data.size) return;
    chunks.push(e.data);
    const ctype = rec.mimeType || "audio/webm";
    sttChain = sttChain.then(() =>
      post("/stt/chunk?s=" + sttSid, e.data, { "X-Audio-Type": ctype })
    ).catch(() => { sttFailed = true; });
  };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
    if (blob.size < 1200) { setStatus("too short", "err"); return; }
    runTurn(blob, blob.type || "audio/webm", null);
  };
  recorder.start(2000);
  talk.classList.remove("speaking");
  talk.classList.add("rec");
  talk.textContent = "Release to send";
  setStatus("listening…", "busy");
}

function stopRec() {
  recWanted = false;
  if (recorder && recorder.state === "recording") recorder.stop();
  recorder = null;
  talk.classList.remove("rec");
  updateTalkBtn();
}

// Tap vs hold: the mic only opens once the finger has stayed down past TAP_MS
// without wandering. A shorter press is a tap — it stops any speech in flight
// and records nothing, so it can never send an empty turn. Pointer events
// cover mouse and touch alike.
const TAP_MS = 250, TAP_SLOP = 12;
let pressTimer = null, pressX = 0, pressY = 0, pressMoved = false;
talk.addEventListener("pointerdown", e => {
  e.preventDefault();
  // The unlock must happen here: by the time the hold timer fires the user
  // gesture may no longer count for autoplay.
  unlockAudio();
  pressX = e.clientX; pressY = e.clientY; pressMoved = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressTimer = null; startRec(); }, TAP_MS);
});
talk.addEventListener("pointermove", e => {
  if (Math.hypot(e.clientX - pressX, e.clientY - pressY) > TAP_SLOP) pressMoved = true;
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
  talk.addEventListener(ev, e => {
    e.preventDefault();
    if (pressTimer !== null) {
      clearTimeout(pressTimer);
      pressTimer = null;
      if (ev === "pointerup" && !pressMoved && (voicePlaying || voiceQueue.length))
        stopSpeech();
      return;
    }
    stopRec();
  }));

function sendTyped() {
  const v = $("text").value.trim();
  if (!v) return;
  $("text").value = "";
  unlockAudio();
  runTurn(null, null, v);
}
$("send").addEventListener("click", sendTyped);
$("text").addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });

fetch("/health").then(r => r.json()).then(h => {
  if (h.name) { $("name").textContent = h.name; document.title = h.name; }
}).catch(() => {});

// Seed a freshly loaded page with where the conversation currently stands, so
// picking the phone up mid-thread doesn't start from a blank screen. Nothing
// stored yet means nothing shown — no empty scaffolding. The same rendering
// serves a RESEED: when /watch reports the conversation file was rewritten
// under the cursor (compaction, archival), the page redraws from a fresh
// /context exactly as a manual refresh would — that refresh used to be his
// hand's job.
// Turns into bubbles, in one place, for all three callers (the page-load seed,
// the watcher, and the redraw after a rewrite). The convo file stores one line
// per turn, so a user turn and the reply that follows it are paired back up
// here into the same shape a live turn takes. An assistant turn with no user
// turn before it — an autonomous wake — is rendered on its own: skipping
// non-user turns here silently erased every wake exchange from a reloaded page.
// `skip` is consulted per turn before anything is built; `after` is handed each
// finished block.
function appendTurns(parent, turns, cls, skip, after) {
  for (let i = 0; i < turns.length; i++) {
    // A turn holding nothing is not drawn. The server filters these too; this
    // is the second belt, for a page cached against an older one.
    if (!norm(turns[i].text) && !turns[i].display_html) continue;
    if (skip && skip(turns[i])) continue;
    const t = document.createElement("div");
    t.className = cls;
    if (turns[i].role === "user") {
      const y = document.createElement("div");
      y.className = "you"; y.textContent = turns[i].text;
      t.append(y);
      const next = turns[i + 1];
      if (next && next.role === "assistant") {
        const r = document.createElement("div");
        r.className = "reply"; r.textContent = next.text;
        t.append(r);
        if (next.display_html) attachDisplay(r, next.display_html);
        i++;
      }
    } else {
      const r = document.createElement("div");
      r.className = "reply"; r.textContent = turns[i].text;
      t.append(r);
      if (turns[i].display_html) attachDisplay(r, turns[i].display_html);
    }
    parent.append(t);
    if (after) after(t);
  }
}

function renderSeed(ctx) {
  const turns = ctx.turns || [];
  if (!ctx.summary && !turns.length) return;

  const seed = document.createElement("div");
  seed.id = "seed";
  const label = document.createElement("div");
  label.className = "seed-label";
  label.textContent = "where we were";
  seed.append(label);

  if (ctx.summary) {
    const s = document.createElement("div");
    s.className = "seed-summary";
    s.textContent = ctx.summary;
    seed.append(s);
  }

  appendTurns(seed, turns, "turn");

  logEl.prepend(seed);
  seed.scrollIntoView({ block: "end" });
}

fetch("/context", { credentials: "same-origin" }).then(r => r.json()).then(ctx => {
  // Any wake audio already pending was routed before this page existed —
  // mark it heard so loading the app never blares an old clip. A pending
  // media hand-off is seeded the same way and for the same reason.
  wakeSeen = ctx.wake_id || "";
  playSeen = ctx.play_id || "";
  cursor = ctx.n;
  gen = ctx.gen || "";
  renderSeed(ctx);
  // After the seed, deliberately: whether the remembered turn already
  // answered is read off the seed itself (spec rule 39).
  resumePending(ctx);
}).then(startWatch).catch(startWatch);

// Two turns are the same turn when the same speaker said the same words. The
// record carries no turn ids, so this is the whole of identity here — and it is
// already what the own-turn filter matches on, so the two agree by
// construction.
function turnKey(role, text) {
  return role + " " + norm(text);
}

// What the page is showing right now, counted by identity. The DOM is
// deliberately the source of truth: it is exactly what he can see, and a
// parallel list of "what we drew" could only drift away from it. Counting
// rather than set membership keeps a sentence said twice from collapsing into
// one when the file is re-read.
function renderedKeys() {
  const m = new Map();
  const bubbles = logEl.querySelectorAll(".you, .reply");
  for (let i = 0; i < bubbles.length; i++) {
    const el = bubbles[i];
    const role = /(^|\s)you(\s|$)/.test(el.className) ? "user" : "assistant";
    const k = turnKey(role, el.textContent);
    m.set(k, (m.get(k) || 0) + 1);
  }
  return m;
}

// Draw what the rewritten file holds that is NOT already on the page, under a
// rule saying the record was rewritten here. The summary is deliberately not
// drawn: it condenses turns that are still sitting above the rule, in full.
function renderCarried(ctx, shown) {
  const fresh = [];
  const turns = ctx.turns || [];
  for (let i = 0; i < turns.length; i++) {
    const t = turns[i];
    if (!norm(t.text) && !t.display_html) continue;
    const k = turnKey(t.role, t.text);
    const n = shown.get(k) || 0;
    if (n > 0) { shown.set(k, n - 1); continue; }
    fresh.push(t);
  }
  // Nothing arrived that he cannot already see: no rule, no noise. This is the
  // common case for an archival rotation, where the fresh file holds only the
  // exchange that has just been drawn live.
  if (!fresh.length) return;
  const rule = document.createElement("div");
  rule.className = "rewound";
  rule.textContent = "earlier conversation";
  logEl.append(rule);
  appendTurns(logEl, fresh, "turn", null, t => t.scrollIntoView({ block: "end" }));
}

// The conversation file was rewritten under our cursor (compaction, or the
// archival rotation that starts a fresh one). The cursor means nothing against
// the new file, so the page re-reads /context — but WHAT IS ALREADY ON SCREEN
// IS NOT THROWN AWAY.
//
// It used to be. This called logEl.replaceChildren() and redrew from the new
// file alone, which is survivable after a compaction (the file still holds most
// of the conversation) and ruinous after a rotation (it holds none of it).
// Live, 2026-08-07: the conversation had been idle since 22:18, the turn at
// 23:40 rotated it to the archive and started a fresh file, /watch said reset,
// and the phone's whole visible conversation vanished mid-session — leaving the
// one sentence just spoken. Nothing was lost from disk; it was lost from in
// front of him, which is the only place he was reading it.
//
// So: the rendered turns stay, a divider marks where the record was rewritten,
// and only the parts of the new context not already on the page are drawn under
// it. A deliberate reload still starts clean — that is the escape hatch, and
// the reason this only has to hold within one session.
async function reseed() {
  const ctx = await (await fetch("/context", { credentials: "same-origin" })).json();
  // The rewrite folded whatever the pending filters were guarding into the
  // file itself; a match against some future identical turn would eat it.
  pendingUser = pendingReply = null;
  awaitedUserSeen = false;
  const shown = renderedKeys();
  if (shown.size) {
    renderCarried(ctx, shown);
  } else {
    // An empty page has no scrollback to protect, so this is the plain redraw,
    // summary and all — the same thing a fresh load does.
    logEl.replaceChildren();
    renderSeed(ctx);
  }
  cursor = ctx.n;
  gen = ctx.gen || "";
}

// Follow the conversation while it happens somewhere else. Turns spoken at the
// laptop go into the same file, so the phone long-polls for anything past its
// cursor and shows it arriving rather than only on the next page load.
let cursor = null;
// Which incarnation of the conversation file the cursor was read from — the
// server's rewrite detector. Compaction and archival invalidate every
// position-based cursor; when this token stops matching, /watch says `reset`
// instead of silently swallowing the turns that rode in with the rewrite.
let gen = "";
let watching = false;

// The last wake-audio clip this page played (or was told predates it). Sent
// with every poll: its presence tells the server this client can play wake
// audio at all — and so counts as "connected" when a wake picks a speaker.
let wakeSeen = "";

// The turn taken on this phone also lands in the convo file, and the watcher
// must not echo it back as a duplicate bubble. It used to handle that by not
// rendering at all while busy and snapping the cursor forward afterwards —
// which silently swallowed any OTHER turn (an autonomous wake, a turn spoken
// at the laptop) that landed in the same window: consumed by the cursor,
// never rendered, unrecoverable. Instead the own turn is remembered by its
// text and filtered out individually; everything else always renders.
let pendingUser = null;
let pendingReply = null;
// This turn's own User block has come back through the watcher; the next
// unmarked assistant block is its answer (rule 42) unless another User block
// breaks the adjacency first.
let awaitedUserSeen = false;

// A /watch reset that arrived while a turn was in flight. The redraw would
// wipe the exchange being spoken, so it waits here until `busy` clears.
let needReseed = false;

// The reply this page is waiting on arrived through the conversation watcher
// instead of the turn's own stream (rule 42). That is an ordinary arrival,
// not a broken one: the mirror pass can rewrite the draft after its raw text
// streamed, and compaction — a whole model run — sits between the
// conversation append and the exit that emits the done event, so the record
// can carry the answer a minute before the stream does. The arrival IS the
// turn's end: the bubble is reconciled to the record, the stream cut, the
// button handed back. Clips already spoken from the stream are never
// re-voiced — but the watcher carries no audio of its own, so a turn released
// with NOTHING yet voiced would be silent forever: the abort below used to cut
// the very socket the voice was still coming down. When no clip has sounded,
// the stream is left running as a voice tail — the record has the words, the
// stream still owes the sound — and only the UI is released here.
function releaseTurn(t) {
  if (!busy) return;
  const seq = turnSeq;
  releasedSeq = seq;
  const silent = !turnVoiced;
  const r = liveTurn && liveTurn.reply;
  if (r) {
    // Nothing streamed: the record holds the only copy of the answer.
    if (!(r._said || []).length) r.textContent = t.text;
    // The display card never rides the stream's text events; without this it
    // would be lost with the done event.
    if (t.display_html && !r.parentNode.querySelector(".display"))
      attachDisplay(r, t.display_html);
    foldThoughts(liveTurn);
    r.scrollIntoView({ block: "end" });
  }
  if (turnCtl && !silent) turnCtl.abort();
  forgetTurn();
  pendingReply = null;
  busy = false;
  talk.classList.remove("busy");
  updateTalkBtn();
  setStatus("the reply arrived through the conversation — ready");
}

// One filter for every block the watcher delivers. It holds the own-turn
// suppression that keeps this phone's exchange from echoing back as a
// duplicate bubble, and the recognition that ends a turn whose answer arrived
// through the record rather than the stream (rule 42). Identity is text for
// the User block; for the reply it is text when the streamed blocks match,
// and adjacency when they do not — the mirror can rewrite the draft between
// the stream and the record, so the first unmarked assistant block after this
// turn's own question is its answer even worded differently. A User block
// that is not this turn's question breaks the adjacency: whatever follows it
// answers it, not this turn. A marked block (an autonomous wake) is never a
// candidate, and never consumes the wait either — a wake landing mid-turn
// must not cost this turn its release.
function watchFilter(t) {
  if (t.role === "user") {
    if (pendingUser && norm(t.text) === pendingUser) {
      pendingUser = null;
      awaitedUserSeen = true;
      return true;
    }
    awaitedUserSeen = false;
    return false;
  }
  if (!t.mark) {
    if (pendingReply && norm(t.text) === pendingReply) {
      pendingReply = null;
      awaitedUserSeen = false;
      if (busy) releaseTurn(t);
      return true;
    }
    if (awaitedUserSeen) {
      awaitedUserSeen = false;
      // Idle with a reply that matched nothing shown: a late answer to a
      // given-up turn. It must stay visible, so it draws as ever.
      if (busy) { releaseTurn(t); return true; }
    }
  }
  return false;
}

function renderRemote(turns) {
  // Same rule as the seed: an empty block is not a bubble — appendTurns holds
  // that line. What is extra here is the filter above: this phone's own
  // exchange comes back around through the file and must not be drawn twice.
  appendTurns(logEl, turns, "turn elsewhere", watchFilter,
              t => t.scrollIntoView({ block: "end" }));
}

async function startWatch() {
  if (watching) return;
  watching = true;
  let retry = 1000;
  for (;;) {
    try {
      // A rewrite that arrived while a turn was in flight: redraw now that
      // the turn has landed. This is the only place it can happen, because
      // it is the only loop that runs after `busy` clears.
      if (needReseed && !busy) { await reseed(); needReseed = false; }
      const q = "/watch?wait=1&wakeseen=" + encodeURIComponent(wakeSeen)
              + "&playseen=" + encodeURIComponent(playSeen)
              + (cursor === null ? "" : "&since=" + cursor)
              + "&gen=" + encodeURIComponent(gen);
      // The server answers every poll within its ~25 s window even when
      // nothing happened — that answer is the heartbeat. A fetch still
      // hanging well past it is a dead link (tailnet gone, laptop asleep)
      // that TCP alone might sit on for many minutes; cut it and retry.
      const ctl = new AbortController();
      const guard = setTimeout(() => ctl.abort(), 45000);
      let data;
      try {
        const res = await fetch(q, { credentials: "same-origin", signal: ctl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
      } finally { clearTimeout(guard); }
      retry = 1000;
      // A wake routed its voice here because this phone was the live device.
      // Played through the same queue as reply clips, acknowledged so the
      // next poll doesn't repeat it.
      if (data.wake && data.wake.id !== wakeSeen) {
        wakeSeen = data.wake.id;
        // A stop applies to the speech it interrupted, not to a wake that
        // hasn't spoken yet.
        voiceMuted = false;
        enqueueVoice(data.wake.audio);
      }
      // A handed piece. Not gated on voiceMuted — the stop-tap is about
      // speech — and the persistent mute silences rather than suppresses,
      // so the id is acknowledged either way and never replays later.
      if (data.play && data.play.id !== playSeen) {
        playSeen = data.play.id;
        showMedia(data.play);
      }
      if (data.reset) {
        // The conversation file was rewritten under the cursor (compaction,
        // archival) — a slice against it would be the wrong turns, so redraw
        // from scratch instead.
        //
        // Mid-turn the redraw would wipe the exchange in flight, so it is
        // DEFERRED, not skipped: the new incarnation is adopted right here so
        // the poll goes back to waiting (the cursor and gen used to sit below
        // the `continue`, so the next poll re-asked with the same stale gen,
        // the server answered it instantly, and the loop span at 2 s for the
        // whole turn and drew nothing — twelve identical polls in 23 seconds
        // in the live log). Nothing is lost by consuming the cursor here,
        // because the queued reseed redraws the whole conversation.
        //
        // The trigger is structural, not rare: compact_convo runs inside
        // every phone turn, and compaction is exactly what changes the gen.
        cursor = data.n;
        if (data.gen !== undefined) gen = data.gen;
        if (busy) {
          // The answer this page is waiting on can ride the reset itself —
          // compaction is what changes the gen, and compaction runs inside
          // the very turn being waited on. The payload is scanned, never
          // drawn (the queued reseed redraws everything), so rule 42's
          // release is not lost with the deferral.
          (data.turns || []).forEach(watchFilter);
          needReseed = true;
          continue;
        }
        await reseed();
        needReseed = false;
        continue;
      }
      cursor = data.n;
      if (data.gen !== undefined) gen = data.gen;
      if (data.turns.length) renderRemote(data.turns);
    } catch (e) {
      // Phone asleep, laptop rebooting, tailnet blipping — try again, backing
      // off so a long outage isn't hammered, snapping back on any success.
      await new Promise(r => setTimeout(r, retry));
      retry = Math.min(retry * 2, 30000);
    }
  }
}


// --- Web Push: reaching this phone with the page CLOSED ----------------------
// Subscribing is a deliberate act (the bell) because it pops the browser's
// permission prompt, and that prompt is only granted inside a user gesture.
// Everything after that is idempotent: every page load re-posts the existing
// subscription, so the server's store survives reloads and endpoint rotation.
const bell = $("bell");
const pushOk = "serviceWorker" in navigator && "PushManager" in window
            && "Notification" in window;

function b64uToBytes(s) {
  const raw = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

function setBell(on) {
  bell.classList.toggle("on", !!on);
  bell.title = on ? "Notifications on — tap to disable" : "Enable notifications";
}

async function pushSync() {
  // On iOS the Push API only exists once the page is installed to the home
  // screen — until then the bell simply stays hidden.
  if (!pushOk) return;
  bell.hidden = false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub && Notification.permission === "granted") {
      await post("/push/subscribe", JSON.stringify(sub),
                 { "Content-Type": "application/json" });
      setBell(true);
      return;
    }
  } catch (_) {}
  setBell(false);
}

async function pushToggle() {
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      // Off means off on both sides: a subscription dropped only in the
      // browser would linger in the store and fail forever at send time.
      await sub.unsubscribe().catch(() => {});
      await post("/push/unsubscribe", JSON.stringify({ endpoint: sub.endpoint }),
                 { "Content-Type": "application/json" }).catch(() => {});
      setBell(false);
      setStatus("notifications off");
      return;
    }
    if (Notification.permission === "denied") {
      setStatus("notifications blocked in browser settings", "err");
      return;
    }
    if ((await Notification.requestPermission()) !== "granted") {
      setStatus("notifications not allowed", "err");
      return;
    }
    const key = await fetch("/push/key", { credentials: "same-origin" })
      .then(r => {
        if (!r.ok) throw new Error(r.status === 501
          ? "server is missing python-cryptography" : "HTTP " + r.status);
        return r.json();
      });
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64uToBytes(key.key),
    });
    await post("/push/subscribe", JSON.stringify(sub),
               { "Content-Type": "application/json" });
    setBell(true);
    setStatus("notifications on");
  } catch (e) {
    setStatus("push: " + (e.message || e), "err");
  }
}
if (pushOk) bell.addEventListener("click", pushToggle);

if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("/sw.js").then(pushSync).catch(() => {});
</script>
