<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Chess</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 45 45'%3E%3Ccircle cx='22.5' cy='14' r='6' fill='%23d8b36a'/%3E%3Cpath d='M19 18 C17 21 17.6 24 19.8 26.2 C16.8 28.6 15 32 15 35.5 L30 35.5 C30 32 28.2 28.6 25.2 26.2 C27.4 24 28 21 26 18 Z' fill='%23d8b36a'/%3E%3C/svg%3E">
	<!-- The shared voice queue (phone.md rule 44c; chessweb.md rule 24g):
	     the same file the phone server serves, from the bridge's own route.
	     Both deferred, in order, so board.js finds it built. -->
	<script src="browser_voice_queue.js" defer></script>
	<script src="face_card.js" defer></script>
	<script src="board.js" defer></script>
</head>

<body>
	<!-- The piece set. Original shapes drawn for this page: no third-party
	     assets ride in this repo. Colour comes from CSS on the <use> wrapper. -->

		</symbol>
		<symbol id="pc-R" viewBox="0 0 45 45">
			<path d="M 12.5,34 L 12.5,31 L 15.2,28 L 15.2,17 L 13,17 L 13,10 L 17.6,10 L 17.6,12.6 L 20.4,12.6 L 20.4,10 L 24.6,10 L 24.6,12.6 L 27.4,12.6 L 27.4,10 L 32,10 L 32,17 L 29.8,17 L 29.8,28 L 32.5,31 L 32.5,34 Z"/>

			<circle class="ink" cx="16.6" cy="16.2" r="1.15"/>
			<rect x="11.5" y="35" width="22" height="3.8" rx="1.6"/>
		</symbol>
		<symbol id="pc-B" viewBox="0 0 45 45">
			<circle cx="22.5" cy="7.2" r="1.9"/>
			<path d="M 22.5,10.2 C 26.4,13.1 28.7,17 28.7,21 C 28.7,25.4 26,28.4 22.5,28.4 C 19,28.4 16.3,25.4 16.3,21 C 16.3,17 18.6,13.1 22.5,10.2 Z"/>
			<path class="ink line" d="M 22.5,14.6 L 22.5,20 M 20.1,17.3 L 24.9,17.3"/>
			<path d="M 18.3,29.6 L 26.7,29.6 L 28,32.8 L 17,32.8 Z"/>

		</symbol>
		<symbol id="pc-Q" viewBox="0 0 45 45">
			<circle cx="9" cy="11.6" r="1.5"/>
			<circle cx="16" cy="8.6" r="1.5"/>
			<circle cx="22.5" cy="7.2" r="1.5"/>
			<circle cx="29" cy="8.6" r="1.5"/>
			<circle cx="36" cy="11.6" r="1.5"/>
			<path d="M 11,26 L 9,14 L 12.9,20.3 L 16,11 L 19.2,19.2 L 22.5,9.6 L 25.8,19.2 L 29,11 L 32.1,20.3 L 36,14 L 34,26 C 29.8,24.7 26.3,24.1 22.5,24.1 C 18.7,24.1 15.2,24.7 11,26 Z"/>
			<path d="M 11.9,27.7 C 15.9,26.4 19,25.9 22.5,25.9 C 26,25.9 29.1,26.4 33.1,27.7 L 31.2,34 L 13.8,34 Z"/>
			<rect x="11.5" y="35" width="22" height="3.8" rx="1.6"/>
		</symbol>
		<symbol id="pc-K" viewBox="0 0 45 45">
			<path d="M 21.4,5.5 L 23.6,5.5 L 23.6,8.6 L 26.7,8.6 L 26.7,10.8 L 23.6,10.8 L 23.6,13.9 L 21.4,13.9 L 21.4,10.8 L 18.3,10.8 L 18.3,8.6 L 21.4,8.6 Z"/>
			<path d="M 22.5,16.4 C 24.8,13.9 28.5,13.3 31.1,15.1 C 34.2,17.3 34.7,22 32.5,25.7 C 30.9,28.4 28.2,30.6 25.3,32.1 L 30.4,32.1 L 30.4,34 L 14.6,34 L 14.6,32.1 L 19.7,32.1 C 16.8,30.6 14.1,28.4 12.5,25.7 C 10.3,22 10.8,17.3 13.9,15.1 C 16.5,13.3 20.2,13.9 22.5,16.4 Z"/>

	<header class="top">
		<div class="portrait-card" aria-label="Beatrice at the chess table">
			<div class="portrait-stack">
				<img id="portrait-resting" data-face-base src="/portrait/resting.png"
					alt="Beatrice, resting at the chess table">
				<img id="portrait-attentive" data-face-expr src="/portrait/attentive.png"
					alt="" aria-hidden="true">
			</div>
			<div class="portrait-copy">
				<h1>Chess with Beatrice</h1>
				<div id="portrait-state">at the table</div>
				<button id="face-size" type="button">Face: Medium</button>
			</div>
		</div>
		<div class="table-state">
			<div id="crab-thinking" hidden></div>
			<div id="turnline"></div>
		</div>
	</header>

	<details id="connbox" open>
		<summary>Connection</summary>
		<div class="conn-row">
			<label class="addr">Server
				<input id="serveraddr" value="127.0.0.1:8181">
			</label>
			<button id="connect" type="button">Connect</button>
			<button id="join" type="button" disabled>Join</button>
			<button id="watch" type="button" disabled>Watch</button>
			<!-- The sitter names themselves before the deal (specs/chessweb.md
			     rule 23): the name rides the /new post onto the game record,
			     is remembered client-side, and an empty box deals an honestly
			     unlabeled game. -->
			<label class="pname">Name
				<input id="playername" maxlength="40" placeholder="who plays?"
					autocomplete="off">
			</label>
			<!-- The clock for the NEXT live game (specs/chessweb.md rule 22h):
			     the currently enabled set plus untimed, nothing invented.
			     New Game posts the pick to /new; the server is the only
			     judge of what it means. -->
			<label class="tc">Clock
				<select id="timecontrol">
					<option value="untimed" selected>untimed</option>
					<option value="3+2">blitz 3+2</option>
					<option value="5+0">blitz 5+0</option>
					<option value="10+0">rapid 10+0</option>
					<option value="15+10">rapid 15+10</option>
				</select>
			</label>
			<button id="newgame" type="button" disabled>New Game</button>
			<button id="resign" type="button" class="danger" disabled>Resign</button>
			<span id="connstate" class="dot"></span>
		</div>
	</details>

	<main class="arena">
		<aside class="graveyard" id="gy-w">
			<div class="gy-head">
				<span class="gy-title">White took</span>
				<span class="gy-badge" id="gy-w-badge" hidden></span>
			</div>
			<div class="gy-clock" id="clock-w" hidden>–:––</div>
			<div class="gy-pieces" id="gy-w-list"></div>
			<div class="gy-score" id="gy-w-score">0 points</div>
		</aside>

		<div id="boardwrap">
			<div id="board"></div>
			<div id="promo" hidden>
				<div class="promo-card">
					<span class="promo-title">Promote to</span>
					<div id="promo-choices"></div>
				</div>
			</div>
			<div id="banner" hidden></div>
		</div>

		<aside class="graveyard" id="gy-b">
			<div class="gy-head">
				<span class="gy-title">Black took</span>
				<span class="gy-badge" id="gy-b-badge" hidden></span>
			</div>
			<div class="gy-clock" id="clock-b" hidden>–:––</div>
			<div class="gy-pieces" id="gy-b-list"></div>
			<div class="gy-score" id="gy-b-score">0 points</div>
		</aside>
	</main>

	<!-- The table chat (specs/chessweb.md rule 24): the thread off GET /chat,
	     a send box onto POST /chat, and the speak toggle of rule 24e — off by
	     default, remembered, speaking only her messages and only those that
	     arrive while it is on, each as a clip of her own voice off
	     GET /chat/audio — never the browser's built-in narrator. The pane is
	     presented in the phone conversation's own vocabulary (THE SHIPPED
	     CLIENT bullet): turns with dim `›` you-lines, the dimmed history
	     seed, the pending echo of a send — board.js builds those shapes. -->
	<section class="chatbox">
		<div class="chat-head">
			<h2>Table chat</h2>
			<span id="chat-vs"></span>
			<span id="chat-record"></span>
			<label class="chat-speak">
				<input type="checkbox" id="chat-speak"> speak
			</label>
		</div>
		<div id="chat-log" aria-live="polite"></div>
		<form id="chat-form">
			<input id="chat-input" maxlength="500"
				placeholder="Say something across the board…"
				autocomplete="off">
			<button id="chat-send" type="submit">Send</button>
		</form>
	</section>

	<section class="consolebox">
		<h2>Console</h2>
		<pre id="console"></pre>
	</section>
</body>

</html>
